# Azure App Service and other cloud platforms can provide PORT.
# Local development continues to use http://localhost:8080.
server.port=${PORT:8080}

# Azure App Service Authentication adds signed-in user information to request
# headers. School accounts can have enough claims to exceed Tomcat's default.
server.max-http-request-header-size=64KB

# Let the platform stop the application cleanly during a deployment or restart.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
