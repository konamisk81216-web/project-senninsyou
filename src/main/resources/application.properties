# Azure App Service and other cloud platforms can provide PORT.
# Local development continues to use http://localhost:8080.
server.port=${PORT:8080}

# Azure App Service Authentication adds signed-in user information to request
# headers. School accounts can have enough claims to exceed Tomcat's default.
server.max-http-request-header-size=64KB

# Let the platform stop the application cleanly during a deployment or restart.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Ask the browser to check with the server before reusing a cached page or file.
# Without this, a browser can keep showing an old index.html (and the old app.js it points to) after a deployment.
# Unchanged files are still answered with 304 Not Modified, so only the check is added.
spring.web.resources.cache.cachecontrol.no-cache=true
