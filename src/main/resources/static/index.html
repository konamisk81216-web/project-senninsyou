<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 千人将 | 司令室</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <aside>
        <h1>千人将</h1>
        <p>SENNINSYOU</p>

        <nav>
            <p>🏯 司令本部</p>
            <p>⚔ 任務管理</p>
            <p>🤖 AI部隊</p>
            <p>💰 収益化サポート</p>
            <p>📊 戦況分析</p>
        </nav>
    </aside>

    <main>
        <header>
            <h2>司令室</h2>
            <span>● SYSTEM ONLINE</span>
        </header>

        <section>
            <h2>👑 AI将軍</h2>
            <p>将軍への伝令をいれてください。</p>

            <input type="text" placeholder="将軍に命令を入力...">
            <button>命令する</button>

            <div id="ai-response">
                <p>将軍からの回答がここに表示されます。</p>
            </div>
            
        </section>

        <section>
            <h2>本日の戦況</h2>

            <p id="total-tasks">総任務：--</p>
            <p id="in-progress-tasks">進行中：--</p>
            <p id="not-started-tasks">未着手：--</p>
            <p id="completed-tasks">完了：--</p>
        </section>

        <section>
            <h2>⚔ 優先任務</h2>

            <div id="task-list">
                任務を読み込み中...
            </div>
        </section>
    </main>

        <script src="/app.js"></script>
</body>

</html>
